<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awards | Yoshee Jain</title>
  <style>
    :root {
      --primary: #00462A;
      --primary-hover: #006B42;
      --border: #CDE1D9;
      --muted: #4A5D57;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f3f8f6, #e8f1ed);
      color: #1a1a1a;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
    }
    .pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0, 70, 42, 0.12);
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 16px;
    }
    a.cta {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 10px 28px rgba(0, 70, 42, 0.28);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    a.cta:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(0, 70, 42, 0.34);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">Awards</div>
    <h1>Awards</h1>
    <p>Highlights and recognitions from the journey so far.</p>
    <a class="cta" href="./">Back to About</a>
  </div>
</body>
</html>
